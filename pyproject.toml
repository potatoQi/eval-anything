[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-anything"
version = "0.1.0"
description = "Run packaged agent benchmarks with EnvWeaver."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["envweaver", "urllib3>=2.3,<3"]

[project.scripts]
eval-anything = "eval_anything.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["eval_anything"]

[tool.uv]
upgrade-package = ["envweaver"]

[tool.ruff]
line-length = 100

[project.optional-dependencies]
gdpval = ["pyarrow>=17"]
